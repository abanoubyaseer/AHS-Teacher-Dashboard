<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء امتحان - Mr Romany Faheam</title>
<link rel="stylesheet" href="style.css">
<style>
.form-layout{display:flex;gap:16px;align-items:flex-start}
.settings-panel{flex:1;min-width:280px;background:white;padding:18px;border-radius:24px;position:sticky;top:80px}
.questions-panel{flex:2;min-width:0}
.big-title{font-size:22px;font-weight:bold;border:none;border-bottom:2px solid #FF6B00;border-radius:0}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F3F4F6}
.switch{position:relative;width:48px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#ccc;border-radius:20px;cursor:pointer}
.slider:before{content:"";position:absolute;width:20px;height:20px;background:white;border-radius:50%;top:3px;right:3px;transition:.3s}
.switch input:checked + .slider{background:#34A853}
.switch input:checked + .slider:before{transform:translateX(-22px)}
.google-bar{position:sticky;bottom:12px;background:white;padding:12px;border-radius:24px;box-shadow:0 10px 25px rgba(0,0,0,.15);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.google-bar button{background:#FFF1E6;border:none;padding:10px 14px;border-radius:20px;cursor:pointer;font-weight:bold}
.google-bar .add-q-main{background:#FF6B00;color:white}
.q-card{background:white;padding:16px;border-radius:24px;margin-bottom:12px}
.q-head{display:flex;justify-content:space-between;gap:8px}
.q-head select{width:140px}
.q-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.q-tools button{background:#FFF1E6;border:none;padding:8px 12px;border-radius:20px;cursor:pointer}
.delete-q{background:#FEE2E2 !important}
@media(max-width:800px){.form-layout{flex-direction:column}.settings-panel{position:static;width:100%}}
</style>
</head>
<body>
<div class="topbar-dash">
  <button class="icon-btn" onclick="window.location.href='dashboard.html'">‹</button>
  <div class="top-title"><h2>📝 إنشاء امتحان</h2><p id="autoSaveText" style="color:#34A853">💾 حفظ تلقائي</p></div>
  <button class="icon-btn" style="background:#34A853" onclick="publishExam()">🚀</button>
</div>
<div class="main form-layout">
  <div class="settings-panel">
    <h3>⚙️ إعدادات الامتحان</h3>
    <label>🎓 المرحلة</label>
    <select id="examStage" onchange="autoSave()"><option>أولى بكالوريا</option><option>تانية بكالوريا</option><option>تالتة بكالوريا</option></select>
    <label>📌 حالة الامتحان</label>
    <select id="publishMode" onchange="autoSave(); togglePublishTimes()"><option value="draft">📝 مسودة - مانزلهوش</option><option value="now">🚀 انشره دلوقتي</option><option value="later">⏰ انزله بعد مدة</option></select>
    <div id="publishLaterBox" style="display:none"><label>⏰ إمتى ينزل؟</label><input type="datetime-local" id="publishAt" onchange="autoSave()"></div>
    <div class="setting-row"><span>📌 إجباري لازم يتحل</span><label class="switch"><input type="checkbox" id="isRequired" checked onchange="autoSave()"><span class="slider"></span></label></div>
    <div class="setting-row"><span>🔀 لخبطة الأسئلة</span><label class="switch"><input type="checkbox" id="isShuffle" onchange="autoSave()"><span class="slider"></span></label></div>
    <div class="setting-row"><span>🔀 لخبطة الاختيارات</span><label class="switch"><input type="checkbox" id="shuffleOptions" checked onchange="autoSave()"><span class="slider"></span></label></div>
    <div class="setting-row"><span>🚫 منع الغش</span><label class="switch"><input type="checkbox" id="antiCheat" checked onchange="autoSave()"><span class="slider"></span></label></div>
    <div class="setting-row"><span>👁️ إظهار النتيجة بعد التسليم</span><label class="switch"><input type="checkbox" id="showResult" checked onchange="autoSave()"><span class="slider"></span></label></div>
    <div class="setting-row"><span>✅ إظهار الصح والغلط في التقرير</span><label class="switch"><input type="checkbox" id="showAnswers" checked onchange="autoSave()"><span class="slider"></span></label></div>
    <label>🔔 التنبيه قبل انتهاء الوقت - انت حدد المدة</label>
    <select id="warnTime" onchange="autoSave()"><option value="2">قبلها بـ 2 دقيقة</option><option value="5" selected>قبلها بـ 5 دقايق</option><option value="10">قبلها بـ 10 دقايق</option><option value="15">قبلها بـ 15 دقيقة</option></select>
    <label>🔁 عدد المحاولات - انت حددها</label>
    <select id="attempts" onchange="autoSave()"><option value="1">مرة واحدة</option><option value="2">مرتين</option><option value="3">3 مرات</option><option value="999">مفتوح</option></select>
    <label>🎫 دخول الطالب بالكود بتاعه</label>
    <p style="font-size:12px;color:#6B7280">الطالب مش هيدخل على الأسئلة غير لما يكتب الكود الـ 6 حروف بتاعه اللي اتعمل لما سجل حسابه</p>
    <label>عدد الأسئلة</label><input id="examCount" readonly value="0">
    <label>⏱️ وقت الامتحان - يبدأ أول ما الطالب يفتح</label><input type="number" id="examTime" value="30" oninput="autoSave()">
    <label>⏰ تايمر حذف الامتحان</label><input type="datetime-local" id="deleteAt" onchange="autoSave()">
    <label>🔒 الامتحان هيتقفل إمتى؟</label><input type="datetime-local" id="examClose" onchange="autoSave()">
    <label>الدرجة الكلية</label><input id="examTotal" readonly value="0">
    <label>درجة النجاح</label><input type="number" id="passGrade" value="10" oninput="autoSave()">
    <label>كل صفحة فيها كام سؤال؟</label><select id="perPage" onchange="autoSave()"><option value="5">5 ثم التالي</option><option value="10">10 ثم التالي</option><option value="1">سؤال واحد ثم التالي</option><option value="1000">كل الأسئلة في صفحة واحدة</option></select>
    <label>الرسالة بعد التسليم</label><textarea id="afterMsg" oninput="autoSave()">أحسنت يا بطل! تم التسليم ❤️</textarea>
    <button class="btn" style="background:#EA4335" onclick="clearDraft()">🗑️ مسح المسودة</button>
  </div>
  <div class="questions-panel">
    <input id="examTitle" placeholder="عنوان الامتحان * إجباري" oninput="autoSave()" class="big-title" style="background:white;padding:16px;border-radius:24px">
    <input id="examSub" placeholder="العنوان الثاني - اختياري" oninput="autoSave()" style="background:white;padding:16px;border-radius:24px">
    <div id="questionsList" style="margin-top:12px"></div>
    <div class="google-bar"><button class="add-q-main" onclick="addQuestion('mcq')">+ إضافة سؤال</button><button onclick="addQuestion('mcq')">✏️ اختياري</button><button onclick="addQuestion('tf')">✅❌ صح وغلط</button><button onclick="addQuestion('essay')">📝 مقالي</button></div>
    <button class="btn" onclick="publishExam()">🚀 نشر الامتحان</button>
    <button class="btn" style="background:#6B7280" onclick="saveAsDraft()">📝 حفظ كمسودة</button>
  </div>
</div>
<script src="app.js"></script>
<script>
let questions = JSON.parse(localStorage.getItem('examDraftQuestions')||'[]');
function loadDraft(){ let d=JSON.parse(localStorage.getItem('examDraft')||'{}'); if(d.title) document.getElementById('examTitle').value=d.title; if(d.sub) document.getElementById('examSub').value=d.sub; if(d.stage) document.getElementById('examStage').value=d.stage; if(d.time) document.getElementById('examTime').value=d.time; if(d.close) document.getElementById('examClose').value=d.close; if(d.passGrade) document.getElementById('passGrade').value=d.passGrade; if(d.perPage) document.getElementById('perPage').value=d.perPage; if(d.afterMsg) document.getElementById('afterMsg').value=d.afterMsg; if(d.isRequired!==undefined) document.getElementById('isRequired').checked=d.isRequired; if(d.isShuffle!==undefined) document.getElementById('isShuffle').checked=d.isShuffle; if(d.shuffleOptions!==undefined) document.getElementById('shuffleOptions').checked=d.shuffleOptions; if(d.antiCheat!==undefined) document.getElementById('antiCheat').checked=d.antiCheat; if(d.showResult!==undefined) document.getElementById('showResult').checked=d.showResult; if(d.showAnswers!==undefined) document.getElementById('showAnswers').checked=d.showAnswers; if(d.warnTime) document.getElementById('warnTime').value=d.warnTime; if(d.attempts) document.getElementById('attempts').value=d.attempts; if(d.publishMode) document.getElementById('publishMode').value=d.publishMode; if(d.publishAt) document.getElementById('publishAt').value=d.publishAt; if(d.deleteAt) document.getElementById('deleteAt').value=d.deleteAt; togglePublishTimes(); renderQuestions(); }
function autoSave(){ let draft={title:document.getElementById('examTitle').value, sub:document.getElementById('examSub').value, stage:document.getElementById('examStage').value, time:document.getElementById('examTime').value, close:document.getElementById('examClose').value, passGrade:document.getElementById('passGrade').value, perPage:document.getElementById('perPage').value, afterMsg:document.getElementById('afterMsg').value, isRequired:document.getElementById('isRequired').checked, isShuffle:document.getElementById('isShuffle').checked, shuffleOptions:document.getElementById('shuffleOptions').checked, antiCheat:document.getElementById('antiCheat').checked, showResult:document.getElementById('showResult').checked, showAnswers:document.getElementById('showAnswers').checked, warnTime:document.getElementById('warnTime').value, attempts:document.getElementById('attempts').value, publishMode:document.getElementById('publishMode').value, publishAt:document.getElementById('publishAt').value, deleteAt:document.getElementById('deleteAt').value}; localStorage.setItem('examDraft',JSON.stringify(draft)); localStorage.setItem('examDraftQuestions',JSON.stringify(questions)); let t=document.getElementById('autoSaveText'); if(t) t.innerText='💾 تم الحفظ تلقائياً '+new Date().toLocaleTimeString('ar-EG'); }
function togglePublishTimes(){ let m=document.getElementById('publishMode'); if(!m) return; document.getElementById('publishLaterBox').style.display=m.value==='later'?'block':'none'; }
function addQuestion(type){ let q={id:Date.now()+Math.random(), type, text:'', grade:5, options: type==='mcq'?['','','','']: type==='tf'?['صح','غلط']:[], correct:0, correctText:'', img:''}; questions.push(q); autoSave(); renderQuestions(); }
function renderQuestions(){ let list=document.getElementById('questionsList'); if(!list) return; document.getElementById('examCount').value=questions.length; let total=questions.reduce((s,q)=>s+parseInt(q.grade||0),0); document.getElementById('examTotal').value=total; list.innerHTML=questions.map((q,i)=>{ let opts=''; if(q.type==='mcq'){ opts=q.options.map((o,oi)=>`<div style="display:flex;gap:8px;align-items:center"><input type="radio" name="q${q.id}" ${q.correct===oi?'checked':''} onclick="updateQ(${q.id},'correct',${oi},null)" style="width:20px"><input placeholder="اختيار ${oi+1}" value="${o}" oninput="updateQ(${q.id},'opt',${oi},this.value)" style="flex:1"></div>`).join('')+`<button onclick="addOption(${q.id})">+ اختيار</button>`; } if(q.type==='tf'){ opts=`<label>الإجابة الصح: <select onchange="updateQ(${q.id},'correct',0,this.value)"><option value="0" ${q.correct==0?'selected':''}>صح</option><option value="1" ${q.correct==1?'selected':''}>غلط</option></select></label>`; } if(q.type==='essay'){ opts=`<input placeholder="الإجابة النموذجية" value="${q.correctText||''}" oninput="updateQ(${q.id},'correctText',0,this.value)">`; } let typeName=q.type==='mcq'?'اختياري':q.type==='tf'?'صح وغلط':'مقالي'; return `<div class="q-card"><div class="q-head"><b>سؤال ${i+1} - ${typeName}</b><select onchange="changeQType(${q.id},this.value)"><option value="mcq" ${q.type==='mcq'?'selected':''}>اختياري</option><option value="tf" ${q.type==='tf'?'selected':''}>صح وغلط</option><option value="essay" ${q.type==='essay'?'selected':''}>مقالي</option></select></div><textarea placeholder="اكتب السؤال..." oninput="updateQ(${q.id},'text',0,this.value)">${q.text||''}</textarea>${q.img?`<img src="${q.img}" style="width:100%;border-radius:16px">`:''}<div>${opts}</div><div class="q-tools"><label>درجة: <input type="number" value="${q.grade}" style="width:70px" oninput="updateQ(${q.id},'grade',0,this.value)"></label><label><input type="file" accept="image/*" onchange="uploadQImg(${q.id},event)" style="display:none"><span style="background:#E8F0FE;padding:8px 12px;border-radius:20px;cursor:pointer;display:inline-block">🖼️ صورة</span></label><button onclick="duplicateQ(${q.id})">📄 نسخ</button><button onclick="moveQ(${q.id},-1)">⬆️</button><button onclick="moveQ(${q.id},1)">⬇️</button><button class="delete-q" onclick="deleteQ(${q.id})">🗑️ حذف</button></div></div>`; }).join(''); }
function updateQ(id,field,idx,val){ let q=questions.find(x=>x.id===id); if(!q) return; if(field==='text') q.text=val; if(field==='grade') q.grade=val; if(field==='opt') q.options[idx]=val; if(field==='correct') q.correct=parseInt(val ?? idx); if(field==='correctText') q.correctText=val; autoSave(); }
function changeQType(id,newType){ let q=questions.find(x=>x.id===id); q.type=newType; if(newType==='mcq') q.options=['','','','']; if(newType==='tf') q.options=['صح','غلط']; if(newType==='essay') q.options=[]; autoSave(); renderQuestions(); }
function addOption(id){ let q=questions.find(x=>x.id===id); q.options.push(''); autoSave(); renderQuestions(); }
function duplicateQ(id){ let q=questions.find(x=>x.id===id); let copy=JSON.parse(JSON.stringify(q)); copy.id=Date.now()+Math.random(); questions.push(copy); autoSave(); renderQuestions(); }
function moveQ(id,dir){ let idx=questions.findIndex(x=>x.id===id); let ni=idx+dir; if(ni<0||ni>=questions.length) return; [questions[idx],questions[ni]]=[questions[ni],questions[idx]]; autoSave(); renderQuestions(); }
function uploadQImg(id,e){ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=()=>{ let q=questions.find(x=>x.id===id); q.img=r.result; autoSave(); renderQuestions(); }; r.readAsDataURL(f); }
function deleteQ(id){ if(!confirm('تحذف السؤال؟')) return; questions=questions.filter(q=>q.id!==id); autoSave(); renderQuestions(); }
function clearDraft(){ if(!confirm('تمسح المسودة؟')) return; questions=[]; localStorage.removeItem('examDraft'); localStorage.removeItem('examDraftQuestions'); location.reload(); }
function saveAsDraft(){ autoSave(); let title=document.getElementById('examTitle').value.trim(); if(!title){ alert('اكتب العنوان'); return; } let draft=JSON.parse(localStorage.getItem('examDraft')||'{}'); let item={id:Date.now(), kind:'exam', title, sub:document.getElementById('examSub').value, ...draft, questions, status:'draft', created:new Date().toLocaleString('ar-EG')}; let arr=JSON.parse(localStorage.getItem('exams')||'[]'); arr.push(item); localStorage.setItem('exams',JSON.stringify(arr)); alert('تم حفظه كمسودة 📝'); window.location.href='dashboard.html'; }
function publishExam(){ let title=document.getElementById('examTitle').value.trim(); if(!title){ alert('اكتب العنوان الأساسي - إجباري'); return; } if(questions.length===0){ alert('ضيف سؤال'); return; } let draft=JSON.parse(localStorage.getItem('examDraft')||'{}'); let mode=document.getElementById('publishMode').value; let item={id:Date.now(), kind:'exam', title, sub:document.getElementById('examSub').value, ...draft, questions, status: mode==='draft'?'draft': mode==='later'?'scheduled':'published', created:new Date().toLocaleString('ar-EG')}; let arr=JSON.parse(localStorage.getItem('exams')||'[]'); arr.push(item); localStorage.setItem('exams',JSON.stringify(arr)); questions=[]; localStorage.removeItem('examDraft'); localStorage.removeItem('examDraftQuestions'); if(mode==='later'){ alert('تم جدولة النزول ⏰ هينزل في الوقت اللي اخترته'); } else if(mode==='draft'){ alert('تم حفظه كمسودة 📝'); } else { alert('تم النشر ✅ الطالب هيدخل بالكود بتاعه'); } window.location.href='dashboard.html'; }
loadDraft();
</script>
</body>
</html>
