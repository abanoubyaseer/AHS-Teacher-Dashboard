<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHS - لوحة تحكم المستر</title>
<style>
  *{box-sizing:border-box;font-family:Tahoma,sans-serif}
  body{margin:0;background:#0f172a;color:white}
  .login{max-width:400px;margin:60px auto;background:#1e293b;padding:25px;border-radius:16px;text-align:center}
  input,select,textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;outline:none}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:#facc15;font-weight:bold;cursor:pointer;font-size:16px}
  .dash{display:none;padding:20px;max-width:900px;margin:auto}
  .top{display:flex;align-items:center;gap:12px;background:#1e293b;padding:15px;border-radius:14px}
  .top img{width:55px;height:55px;border-radius:50%;background:#334155}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
  .card{background:#1e293b;padding:16px;border-radius:14px}
  .card h3{margin:0 0 10px;color:#facc15}
  .hidden{display:none}
  .exam-list{background:#0f172a;padding:10px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>

<!-- صفحة الدخول -->
<div class="login" id="loginPage">
  <h1>🎓 AHS</h1>
  <p>لوحة تحكم المستر</p>
  <input id="tName" placeholder="اسم المستر">
  <input id="tPass" type="password" placeholder="كلمة السر">
  <button onclick="login()">دخول لوحة التحكم</button>
  <p style="font-size:13px;color:#94a3b8">جرّب أي اسم وأي باسورد دلوقتي - نسخة تجريبية</p>
</div>

<!-- لوحة التحكم -->
<div class="dash" id="dashPage">
  <div class="top">
    <img src="https://via.placeholder.com/55">
    <div>
      <b id="showName">المستر</b><br>
      <small>لوحة التحكم - AHS Teacher Dashboard</small>
    </div>
    <span style="margin-right:auto">🔔</span>
  </div>

  <div class="cards">
    <!-- انشاء امتحان / واجب -->
    <div class="card" style="grid-column:1/3">
      <h3>➕ إنشاء امتحان / واجب</h3>
      <select id="examType">
        <option>امتحان</option>
        <option>واجب</option>
      </select>
      <select id="stage">
        <option>أولى بكالوريا</option>
        <option>تانية بكالوريا</option>
        <option>تالتة بكالوريا</option>
      </select>
      <input id="examTitle" placeholder="عنوان الامتحان - مثال: امتحان الوحدة الأولى">
      <select id="qType">
        <option>اختيارات</option>
        <option>صح وغلط</option>
        <option>مقالي</option>
      </select>
      <textarea id="qText" placeholder="اكتب السؤال هنا..."></textarea>
      <input id="qAnswer" placeholder="الإجابة الصحيحة - للتصحيح التلقائي">
      <input id="qDegree" type="number" placeholder="درجة السؤال">
      <input id="qTime" type="number" placeholder="وقت الامتحان بالدقيقة">
      <input id="qImage" placeholder="رابط صورة السؤال - اختياري">
      <button onclick="addExam()">حفظ ونشر للطلبة ✅</button>
      <div id="exams" class="exam-list">لسه مفيش امتحانات - اعمل أول امتحان فوق</div>
    </div>

    <!-- اشعار -->
    <div class="card">
      <h3>📢 إشعار للطلبة</h3>
      <input id="notiText" placeholder="اكتب رسالة جماعية...">
      <button onclick="sendNoti()">إرسال إشعار</button>
      <p id="notiOut" style="font-size:13px"></p>
    </div>

    <!-- شات -->
    <div class="card">
      <h3>💬 الشات الجماعي</h3>
      <p id="chatBox" style="background:#0f172a;padding:10px;border-radius:8px;min-height:60px">أهلاً بيكم في الشات...</p>
      <input id="chatMsg" placeholder="اكتب رسالة...">
      <button onclick="sendChat()">إرسال</button>
    </div>

    <!-- لوحة شرف -->
    <div class="card" style="grid-column:1/3">
      <h3>🏆 لوحة الشرف</h3>
      <input id="topStudent" placeholder="اسم الطالب المتفوق أو الكود بتاعه">
      <button onclick="addTop()">إضافة للوحة الشرف</button>
      <p id="topOut"></p>
    </div>
  </div>
</div>

<script>
function login(){
  let name = document.getElementById('tName').value || 'المستر';
  document.getElementById('showName').innerText = 'مستر ' + name;
  document.getElementById('loginPage').style.display='none';
  document.getElementById('dashPage').style.display='block';
}
function addExam(){
  let title = document.getElementById('examTitle').value;
  let type = document.getElementById('examType').value;
  let stage = document.getElementById('stage').value;
  let q = document.getElementById('qText').value;
  let deg = document.getElementById('qDegree').value;
  let time = document.getElementById('qTime').value;
  if(!title || !q){ alert('اكتب عنوان الامتحان والسؤال الأول'); return; }
  let box = document.getElementById('exams');
  if(box.innerText.includes('لسه مفيش')) box.innerHTML='';
  box.innerHTML += `<div style="border-bottom:1px solid #334155;padding:8px">✅ <b>${title}</b> - ${type} - ${stage} - ${deg} درجة - ${time} دقيقة<br><small>${q}</small></div>`;
  // هنا بعدين هنحفظ في Supabase
  alert('تم حفظ الامتحان - في النسخة الكاملة هيوصل للطلبة تلقائي');
}
function sendNoti(){
  let t = document.getElementById('notiText').value;
  document.getElementById('notiOut').innerText = 'تم إرسال: ' + t + ' 🔔';
}
function sendChat(){
  let m = document.getElementById('chatMsg').value;
  document.getElementById('chatBox').innerHTML += '<br>👤 مستر: ' + m;
}
function addTop(){
  let s = document.getElementById('topStudent').value;
  document.getElementById('topOut').innerText = '🏆 ' + s + ' - في لوحة الشرف';
}
</script>
</body>
</html>
