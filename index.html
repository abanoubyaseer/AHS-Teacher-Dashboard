<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Romany Faheam - AHS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <img class="teacher-img" src="teacher.jpg" alt="Mr Romany Faheam">
    <h1 class="app-name">Mr Romany Faheam</h1>
    <p class="app-sub">AHS - لوحة تحكم المستر</p>

    <div class="input-box">
      <input id="userName" placeholder="اليوزر نيم - روماني فهيم">
    </div>

    <div class="input-box">
      <input id="pass" type="password" placeholder="كلمة السر">
      <button class="monkey-btn" id="monkeyBtn" onclick="togglePass()">🙈</button>
    </div>

    <p id="errorMsg" style="display:none;color:red;font-size:13px;margin:5px 0">اليوزر نيم أو الباسورد غلط - حاول تاني</p>

    <button class="btn" onclick="login()">دخول لوحة التحكم 🚀</button>
    <p style="font-size:12px;color:#9CA3AF;margin-top:12px">AHS - Mr Romany Faheam</p>
  </div>
</div>

<script>
function togglePass(){
  let p = document.getElementById('pass');
  let b = document.getElementById('monkeyBtn');
  if(p.type === 'password'){ p.type='text'; b.innerText='🙉'; }
  else { p.type='password'; b.innerText='🙈'; }
}

function login(){
  let user = document.getElementById('userName').value.trim();
  let pass = document.getElementById('pass').value.trim();
  let err = document.getElementById('errorMsg');

  // اليوزر نيم الصح والباسورد الصح - ثابتين
  let correctUser1 = 'روماني فهيم';
  let correctUser2 = 'Romany Faheam';
  let correctUser3 = 'romany faheam';
  let correctPass = 'teacher567';

  if( (user === correctUser1 || user === correctUser2 || user.toLowerCase() === correctUser3) && pass === correctPass ){
    err.style.display = 'none';
    alert('أهلا بيك يا مستر روماني ❤️');
    // هنا بعدين هنوديه على صفحة لوحة التحكم الرئيسية
    document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:Tahoma"><h1 style="color:#FF6B00">أهلا بيك يا مستر روماني</h1><p>دخلت لوحة التحكم صح ✅</p><p>الصفحة الجاية هنعملها لوحة التحكم الرئيسية</p></div>';
  } else {
    err.style.display = 'block';
  }
}
</script>
</body>
</html>
