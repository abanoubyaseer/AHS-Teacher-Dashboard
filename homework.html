<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRF English - انشاء واجب - مستر</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;background:#FFF8F0;display:flex;justify-content:center}
.app{width:100%;max-width:800px;padding:16px}
.top{background:linear-gradient(135deg,#0B1026,#FF6B00);color:#fff;border-radius:20px;padding:20px;text-align:center}
.top h1{margin:0;font-size:22px}
.top p{margin:6px 0 0;font-size:13px;opacity:.9}
.back{display:inline-block;margin:12px 0;background:#fff;border:1px solid #FFE0B2;padding:10px 14px;border-radius:12px;text-decoration:none;color:#333;font-weight:bold;font-size:13px}
.card{background:#fff;border:1px solid #FFE0B2;border-radius:18px;padding:16px;margin-bottom:12px}
.card label{font-weight:bold;font-size:13px;display:block;margin-bottom:6px}
.card input,.card select,.card textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #E0E0E0;outline:none;margin-bottom:12px;font-family:inherit}
.card input:focus,.card select:focus,.card textarea:focus{border-color:#FF6B00}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbox{border:1px dashed #FFCC80;border-radius:14px;padding:12px;margin-bottom:10px;background:#FFF8F0}
.qbox b{font-size:13px}
.qbox input{margin-top:8px}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:bold;cursor:pointer;font-size:15px}
.btn-add{background:#0B1026;color:#fff;margin-bottom:12px}
.btn-pub{background:#2E7D32;color:#fff}
.btn-del{background:#FFEBEE;color:#C62828;padding:8px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px;float:left}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>MRF English - انشاء واجب 📚 - مستر</h1><p>اكتب الواجب هنا، واختار المرحلة، وانشره، هيوصل للطالب في تطبيقه على طول</p></div>
<a class="back" href="dashboard.html">← رجوع للوحة التحكم</a>
<div class="card">
<label>عنوان الواجب:</label>
<input id="title" placeholder="مثال: Homework - Unit 1">
<label>المرحلة:</label>
<select id="stage"><option value="أولى بكالوريا">أولى بكالوريا</option><option value="تانية بكالوريا">تانية بكالوريا</option><option value="تالتة بكالوريا">تالتة بكالوريا</option></select>
<div class="row"><div><label>الدرجة الكلية:</label><input id="totalGrade" type="number" value="20"></div><div><label>وقت الواجب بالدقيقة:</label><input id="duration" type="number" value="30"></div></div>
<label>✍️ تعليمات الواجب - الطالب هيشوفها قبل ما يدخل الواجب:</label>
<textarea id="instructions" placeholder="مثال: اقرأ كل سؤال كويس، ممنوع الغش، لو خرجت من الواجب هتتسحب الدرجة، حل بنفسك يا بطل 💪"></textarea>
</div>
<div class="card"><h3 style="margin:0 0 12px">الأسئلة</h3><div id="questions"></div><button class="btn btn-add" onclick="addQ()">+ اضافة سؤال</button></div>
<button class="btn btn-pub" onclick="publish()">🚀 نشر الواجب للطلاب</button>
<div id="msg" style="text-align:center;font-weight:bold;margin-top:12px;color:#2E7D32"></div>
</div>
<script>
var qs=[];
function addQ(data){ qs.push(data||{q:'',a1:'',a2:'',a3:'',a4:'',correct:0}); renderQs(); }
function renderQs(){
  var wrap=document.getElementById('questions'); wrap.innerHTML='';
  qs.forEach(function(item,i){
    var d=document.createElement('div'); d.className='qbox';
    d.innerHTML='<button class="btn-del" onclick="delQ('+i+')">حذف</button><b>سؤال '+(i+1)+'</b><input placeholder="اكتب السؤال هنا" value="'+(item.q||'').replace(/"/g,'&quot;')+'" oninput="qs['+i+'].q=this.value"><input placeholder="اختيار 1" value="'+(item.a1||'').replace(/"/g,'&quot;')+'" oninput="qs['+i+'].a1=this.value"><input placeholder="اختيار 2" value="'+(item.a2||'').replace(/"/g,'&quot;')+'" oninput="qs['+i+'].a2=this.value"><input placeholder="اختيار 3" value="'+(item.a3||'').replace(/"/g,'&quot;')+'" oninput="qs['+i+'].a3=this.value"><input placeholder="اختيار 4" value="'+(item.a4||'').replace(/"/g,'&quot;')+'" oninput="qs['+i+'].a4=this.value"><label>الاجابة الصحيحة:</label><select onchange="qs['+i+'].correct=this.value"><option value="0" '+(item.correct==0?'selected':'')+'>اختيار 1</option><option value="1" '+(item.correct==1?'selected':'')+'>اختيار 2</option><option value="2" '+(item.correct==2?'selected':'')+'>اختيار 3</option><option value="3" '+(item.correct==3?'selected':'')+'>اختيار 4</option></select>';
    wrap.appendChild(d);
  });
}
function delQ(i){ qs.splice(i,1); renderQs(); }
function publish(){
  var title=document.getElementById('title').value.trim();
  if(!title){ alert('اكتب عنوان الواجب'); return; }
  if(qs.length===0){ alert('ضيف سؤال واحد على الأقل'); return; }
  var editId=localStorage.getItem('editOldId')||'';
  var urlId=new URLSearchParams(location.search).get('edit')||'';
  var id=urlId || (editId.startsWith('hw:')?editId.split(':')[1]:'') || 'hw_'+Date.now();
  var hw={id:id,title:title,stage:document.getElementById('stage').value,targetStage:document.getElementById('stage').value,totalGrade:document.getElementById('totalGrade').value,duration:document.getElementById('duration').value,instructions:document.getElementById('instructions').value,questions:qs.map(function(q){ return {q:q.q,choices:[q.a1,q.a2,q.a3,q.a4],correct:Number(q.correct)}; }),created:Date.now(),date:Date.now()};
  var list=JSON.parse(localStorage.getItem('teacherHomeworks')||localStorage.getItem('homeworks')||'[]');
  list=list.filter(function(e){ return String(e.id)!==String(id); });
  list.unshift(hw);
  localStorage.setItem('teacherHomeworks', JSON.stringify(list));
  localStorage.setItem('homeworks', JSON.stringify(list));
  var instrs=JSON.parse(localStorage.getItem('examInstructions')||'{}');
  instrs['hw:'+id]=hw.instructions;
  localStorage.setItem('examInstructions', JSON.stringify(instrs));
  localStorage.removeItem('editOldId');
  if(typeof syncPushAll==='function'){ syncPushAll(); }
  document.getElementById('msg').innerText='تم نشر الواجب ✅ - وصل للطلاب في مرحلة '+hw.stage;
  setTimeout(function(){ location.href='dashboard.html'; },1500);
}
window.onload=function(){
  var urlId=new URLSearchParams(location.search).get('edit')||'';
  var editId=localStorage.getItem('editOldId')||'';
  var wantId=urlId || (editId.startsWith('hw:')?editId.split(':')[1]:'');
  if(wantId){
    var list=JSON.parse(localStorage.getItem('teacherHomeworks')||localStorage.getItem('homeworks')||'[]');
    var found=list.find(function(e){ return String(e.id)===String(wantId); });
    if(found){
      document.getElementById('title').value=found.title||'';
      document.getElementById('stage').value=found.stage||found.targetStage||'أولى بكالوريا';
      document.getElementById('totalGrade').value=found.totalGrade||20;
      document.getElementById('duration').value=found.duration||30;
      document.getElementById('instructions').value=found.instructions||'';
      qs=[];
      (found.questions||[]).forEach(function(q){ qs.push({q:q.q,a1:q.choices?q.choices[0]:'',a2:q.choices?q.choices[1]:'',a3:q.choices?q.choices[2]:'',a4:q.choices?q.choices[3]:'',correct:q.correct||0}); });
      renderQs();
      document.querySelector('.top h1').innerText='MRF English - تعديل واجب 📚 - مستر';
    }
  }
  if(qs.length===0){ addQ(); addQ(); }
};
</script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="sync.js"></script>
</body>
</html>
