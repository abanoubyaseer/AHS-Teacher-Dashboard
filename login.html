<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHS - دخول المستر</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <!-- صورة المستر - هتتغير بعدين لصورة المستر الحقيقي -->
    <img class="teacher-img" src="https://via.placeholder.com/120x120.png?text=AHS" alt="صورة المستر">

    <h1 class="app-name">AHS</h1>
    <p class="app-sub">لوحة تحكم المستر - امتحانات وواجبات</p>

    <div class="input-group">
      <input placeholder="اسم المستر">
    </div>
    <div class="input-group2">
      <input type="password" placeholder="كلمة السر">
    </div>
    <div class="input-group3">
      <button class="btn-orange">دخول لوحة التحكم 🚀</button>
      <p style="font-size:12px;color:#9CA3AF;margin-top:12px">نسخة تجريبية - جرب أي اسم وأي باسورد</p>
    </div>
  </div>
</div>

</html>
